# Adapter h-space -> SigLIP 2 of P2 (Appendix C, Table 4): the 49 guided states of the 50-step DDIM
# grid, two noisy views per image, AdamW, batch 32, lr 1e-3, weight decay 1e-4, 60 epochs (the kept
# epoch is the one of best validation R@1).
#   uv run python scripts/p2/train_adapter.py [overrides...]

defaults:
  - p2_adapter_schema
  - _self_

out: checkpoints/celebahq_p2_adapter.pt
p2_checkpoint: checkpoints/celebahq_p2.pt
siglip: google/siglip2-base-patch16-224
train_split: train
val_split: validation
target_cache: null
rebuild_target_cache: false
batch_size: 32
views_per_image: 2
epochs: 60
lr: 0.001
weight_decay: 0.0001
num_workers: 4
n_ddim_steps: 50
include_t999: false
log_every: 100
seed: 42
mlflow_experiment: balancing_act_projector
mlflow_run_name: null
