# EDM training of the CelebA 64x64 generator (Appendix B.1).
#   uv run python scripts/celeba/train_generator.py
# The released checkpoint was obtained by resuming this run (load_from_ckpt=..., lr=...)
# each time the validation loss plateaued: lr 2e-4, then 1e-4, 1e-5 and 1e-6; the EMA weights
# of lowest validation loss are reached after 1,487 epochs.
defaults:
  - celeba_generator_schema
  - _self_

mlflow:
  experiment_name: EDM
dataloader: celeba
batch_size: 256
epoch: 2000
no_val: false
patience: 50
min_delta: 0.0
load_from_ckpt: null
lr: 0.0002
ckpt_every: 10
min_lr: 0.000001
