# Adapter h-space -> SigLIP 2 of the CelebA 64x64 EDM model (Appendix C, Table 4).
#   uv run python scripts/celeba/train_adapter.py
defaults:
  - celeba_adapter_schema
  - dataset: celeba
  - _self_

mlflow:
  experiment_name: hspace_to_siglip
checkpoint: null
out: checkpoints/celeba_adapter.pth
siglip: google/siglip2-base-patch16-224
cache: null
rebuild_cache: false
batch_size: 512
m_views: 2
sigma_min: 0.002
sigma_max: 80.0
epochs: 50
lr: 0.001
subset: null
n_eval: 2000
eval_every: 500
log_every: 100
