# Prompt bank of the Stable Diffusion 1.5 adapter cache (Appendix C, "Data for text-to-image").
# Four templates crossed with "a person" and the four evaluation occupations: 20 prompts, none of
# which names a sensitive attribute, so the attribute of every image comes from the model's own
# bias and not from the conditioning. The sampler draws the prompts uniformly.

templates:
  - "a photo of {subject}"
  - "a portrait photo of {subject}"
  - "a realistic centered portrait of {subject}"
  - "a face of {subject}"

subjects:
  - a person
  - a doctor
  - a firefighter
  - a nurse
  - a receptionist
