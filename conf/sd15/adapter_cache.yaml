# Training cache of the Stable Diffusion 1.5 adapter (Appendix C): 50,000 images generated by
# SD 1.5 itself, with the sampling path of the guided runs (Euler with trailing timesteps, 30 steps,
# CFG 7.5, 512x512) and no negative prompt. Each sample stores the clean latent, its prompt and the
# SigLIP 2 embedding of the decoded image.
#   uv run python scripts/sd15/build_adapter_cache.py

defaults:
  - sd15_adapter_cache_schema
  - _self_

out_dir: data/sd15_adapter_cache # must be new: an existing cache is resumed, not re-encoded
prompts: conf/sd15/adapter_prompts.yaml
n_images: 50000
negative_prompt: ""
resolution: 512 # the positional embedding of the adapter is learned for (512/64)^2 tokens
steps: 30
guidance_scale: 7.5
batch_size: 192
shard_size: 1000
seed: 0
siglip: google/siglip2-base-patch16-224
n_preview: 200
device: null # null -> cuda if available
